name: CI Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ci_checks:
    name: 🔍 CI Checks (Lint & TypeScript)
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run TypeScript check
        run: npx tsc --noEmit
      - name: Run ESLint
        run: npm run lint
