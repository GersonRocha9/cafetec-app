name: Production Build (Main)

on:
  push:
    branches: ['main']

jobs:
  ci_checks:
    name: 🔍 CI Checks (Lint & TypeScript)
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run TypeScript check
        run: npx tsc --noEmit
      - name: Run ESLint
        run: npm run lint

  production_android:
    name: 📱 Build Android Production
    needs: [ci_checks]
    type: build
    params:
      platform: android
      profile: production

  production_ios:
    name: 🍎 Build iOS Production
    needs: [ci_checks]
    type: build
    params:
      platform: ios
      profile: production
