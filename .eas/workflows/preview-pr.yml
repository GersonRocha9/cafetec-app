name: Preview Build (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ci_checks:
    name: 🔍 CI Checks (Lint & TypeScript)
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run TypeScript check
        run: npx tsc --noEmit
      - name: Run ESLint
        run: npm run lint

  preview_android:
    name: 📱 Build Android Preview (APK)
    needs: [ci_checks]
    type: build
    params:
      platform: android
      profile: preview

  preview_ios:
    name: 🍎 Build iOS Preview
    needs: [ci_checks]
    type: build
    params:
      platform: ios
      profile: preview
